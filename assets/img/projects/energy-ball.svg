<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Consolas, 'IBM Plex Mono', monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd2a8"/>
      <stop offset=".45" stop-color="#e0705f"/>
      <stop offset="1" stop-color="#e0705f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d6e4ff"/>
      <stop offset=".45" stop-color="#6d8fd6"/>
      <stop offset="1" stop-color="#6d8fd6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#1c212c"/>
  <g stroke="#2a3140">
    <path d="M0 600h1200M0 650h1200M0 700h1200"/>
  </g>

  <g transform="translate(380 400)">
    <circle r="160" fill="none" stroke="#e0705f" stroke-width="2" stroke-dasharray="6 10" opacity=".6"/>
    <rect x="-34" y="-90" width="68" height="150" rx="16" fill="#f3efe7"/>
    <circle cy="-120" r="30" fill="#f3efe7"/>
    <circle cx="113" cy="-113" r="60" fill="url(#glow)"/>
    <circle cx="113" cy="-113" r="20" fill="#fff1e4"/>
    <text x="-60" y="105" font-size="18" fill="#aeb6c6">player</text>
  </g>

  <g transform="translate(860 430)">
    <circle r="120" fill="none" stroke="#6d8fd6" stroke-width="2" stroke-dasharray="6 10" opacity=".5"/>
    <rect x="-28" y="-72" width="56" height="124" rx="14" fill="#8a93a8"/>
    <circle cy="-98" r="25" fill="#8a93a8"/>
    <circle cx="-85" cy="85" r="46" fill="url(#glow-blue)"/>
    <circle cx="-85" cy="85" r="15" fill="#e6eeff"/>
    <text x="-45" y="95" font-size="18" fill="#8a93a8">opponent</text>
  </g>

  <g transform="translate(70 70)">
    <rect width="420" height="96" rx="12" fill="#252b38" stroke="#3a4253"/>
    <text x="24" y="40" font-size="15" fill="#6f788b">-- each ball knows who it protects</text>
    <text x="24" y="72" font-size="20" fill="#f3efe7">ball.<tspan fill="#e0705f">Owner</tspan> = player</text>
  </g>
</svg>
